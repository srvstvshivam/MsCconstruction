name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        working-directory: ./ms-construction-backend
        run: |
          chmod +x gradlew
          ./gradlew build -x test

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./ms-construction-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./ms-construction-frontend
        run: npm ci

      - name: Build
        working-directory: ./ms-construction-frontend
        run: npm run build
