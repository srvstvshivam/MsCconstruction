spring.application.name=ms-construction-backend

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Admin seed account
app.admin.seed-username=${ADMIN_SEED_USERNAME:admin}
app.admin.seed-password=${ADMIN_SEED_PASSWORD}

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.required=true
spring.mail.properties.mail.smtp.starttls.required=true

app.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

server.port=${PORT:10000}
server.address=0.0.0.0
